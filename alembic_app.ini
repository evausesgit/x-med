# Configuration Alembic de la base APP (backoffice).
#
# Historique DISTINCT de l'historique monolithique (`alembic.ini` + `alembic/`) :
# il gère la future base backoffice et versionne dans `alembic_version_app`
# (voir alembic/app/env.py). Usage : `alembic -c alembic_app.ini upgrade head`.

[alembic]
# path to migration scripts.
script_location = %(here)s/alembic/app

# sys.path path, will be prepended to sys.path if present.
# %(here)s (la racine du projet) et pas `.` : une invocation depuis un autre
# cwd doit toujours pouvoir importer `app.config`.
prepend_sys_path = %(here)s

# Use os.pathsep. Default configuration used for new projects.
path_separator = os

# URL volontairement vide : env.py prend `config.attributes["sqlalchemy_url"]`
# (appelants programmatiques) ou `sqlalchemy.url`, sinon `settings.database_url`.
sqlalchemy.url =


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples

# Logging configuration.  This is also consumed by the user-maintained
# env.py script only.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
