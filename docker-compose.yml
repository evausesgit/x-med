services:
  db:
    image: pgvector/pgvector:pg16
    restart: always
    # /dev/shm du conteneur : 64 Mo par défaut chez Docker → trop peu pour les workers
    # parallèles / gros tris de Postgres sur la table `articles` (26 M+ lignes), d'où des
    # « could not resize shared memory segment: No space left on device ». 1 Go = large.
    shm_size: "1gb"
    # Tuning pour une base de 63 Go / 25 M articles sur un hôte à 62 Go de RAM.
    # Les défauts Postgres (shared_buffers=128 Mo, work_mem=4 Mo) sont dérisoires :
    # l'index plein-texte pèse 5,7 Go à lui seul, d'où des requêtes locales à ~13 s
    # à froid (0,8 s à chaud). On garde davantage en cache Postgres + on hint le
    # planificateur sur le cache OS. Valeurs volontairement modérées : l'hôte fait
    # aussi tourner d'autres conteneurs (Coolify, etc.).
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=8GB"
      - "-c"
      - "effective_cache_size=24GB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "maintenance_work_mem=1GB"
      - "-c"
      - "random_page_cost=1.1"      # stockage SSD/NVMe : accès aléatoire ~ séquentiel
      - "-c"
      - "shared_preload_libraries=pg_prewarm"  # précharge l'index FTS au démarrage
    environment:
      POSTGRES_USER: xmed
      POSTGRES_PASSWORD: xmed
      POSTGRES_DB: xmed
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xmed -d xmed"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Réseau d'accès corpus du compose app (PLAN_EXECUTION_COMPOSE.md étape 9) :
    # l'API de la stack `x-med-app` (et ses previews) joint cette base en lecture
    # seule via l'alias DNS stable `corpus-db`. Déclaré ici pour SURVIVRE à une
    # recréation du conteneur — le `docker network connect` fait à la main ne
    # persiste pas. APPLIQUÉ le 2026-07-27 (`docker compose up -d --no-deps db`,
    # volume nommé rattaché tel quel, alias vérifié depuis l'API post-recréation).
    networks:
      default: {}
      corpus-access:
        aliases: [corpus-db]

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  # api:  (ajouté à l'étape E — FastAPI)
  # web:  (ajouté à l'étape F — React/Next)

volumes:
  pgdata:

networks:
  # Créé par `docker network create xmed-corpus-access` (fait le 2026-07-27).
  # Externe : partagé avec la ressource Coolify `x-med-app` sans coupler les
  # cycles de vie des deux composes.
  corpus-access:
    external: true
    name: xmed-corpus-access
