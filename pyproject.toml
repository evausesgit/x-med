[project]
name = "x-med"
version = "0.1.0"
description = "X-Med — veille médicale PubMed : ingestion, recherche PubMed + IA, digest personnalisé"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "lxml>=5.3",
    "python-dateutil>=2.9",
    "httpx>=0.28",
    # utilisé par scripts/pubmed_daily.py (download des updatefiles) ; sans lui,
    # une install cœur (uv sync --no-dev, ex. image worker Coolify) casse le cron
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
]

[tool.uv]
default-groups = []

# Le projet n'est pas installé comme paquet dans le venv : sans `pythonpath`,
# `uv run --group dev pytest` ne trouve pas `app`.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
